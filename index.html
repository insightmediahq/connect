<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Connect your accounts · Insight Media</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0e0f12;color:#f4f4f5;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0;text-align:center}
    .card{max-width:420px;padding:32px}
    h1{font-size:20px;margin:0 0 8px}
    p{color:#a1a1aa;line-height:1.5}
    .btn{margin-top:20px;background:#23C49C;color:#06291f;border:0;border-radius:10px;padding:14px 22px;font-size:16px;font-weight:600;cursor:pointer}
    .btn[disabled]{opacity:.5;cursor:default}
    .muted{font-size:12px;color:#71717a;margin-top:24px}
  </style>
</head>
<body>
  <div class="card" id="card">
    <h1>Connect your social accounts</h1>
    <p>Insight Media uses this one-time, secure connection to read your audience demographics for your media kit. It takes about 60 seconds, and we never see your password.</p>
    <button class="btn" id="go" disabled>Loading…</button>
    <p class="muted">Powered by Phyllo · Insight Media</p>
  </div>

  <script src="https://cdn.getphyllo.com/connect/v2/phyllo-connect.js"></script>
  <script>
    // The token-minting endpoint (server-side; creds never reach this page).
    var TOKEN_ENDPOINT = "https://sharjbykcpvcghoxxrhc.supabase.co/functions/v1/phyllo-connect";

    function setCard(title, msg){ document.getElementById("card").innerHTML =
      "<h1>"+title+"</h1><p>"+msg+"</p><p class='muted'>Powered by Phyllo · Insight Media</p>"; }

    function slugFromUrl(){
      var p = new URLSearchParams(location.search);
      return (p.get("slug")||"").trim();
    }

    function launch(cfg){
      if(!window.PhylloConnect){ setCard("Couldn't load", "Please refresh the page or contact your manager."); return; }
      var c = window.PhylloConnect.initialize({
        clientDisplayName: cfg.clientDisplayName || "Insight Media",
        environment: cfg.environment,
        userId: cfg.userId,
        token: cfg.token
      });
      c.on("accountConnected", function(a,w,u){ setCard("You're all set 🎉", "Your account is connected. You can close this page."); });
      c.on("accountDisconnected", function(a,w,u){ console.log("disconnected", a); });
      c.on("tokenExpired", function(u){ setCard("Link expired", "Please ask your manager for a fresh connection link."); });
      c.on("exit", function(r,u){ console.log("exit", r); });
      c.on("connectionFailure", function(r,w,u){ console.log("connectionFailure", r); });
      c.open();
    }

    function start(){
      var slug = slugFromUrl();
      if(!slug){ setCard("Invalid link", "This connection link is missing its code. Please ask your manager for a new one."); return; }
      fetch(TOKEN_ENDPOINT + "?slug=" + encodeURIComponent(slug))
        .then(function(r){ return r.json(); })
        .then(function(cfg){
          if(!cfg || cfg.error || !cfg.token){ setCard("Something went wrong", "We couldn't start the connection. Please try again shortly."); return; }
          var btn = document.getElementById("go");
          if(btn){ btn.disabled = false; btn.textContent = "Connect now"; btn.onclick = function(){ launch(cfg); }; }
          launch(cfg); // auto-open for a frictionless tap-through
        })
        .catch(function(e){ console.error(e); setCard("Something went wrong", "We couldn't start the connection. Please try again shortly."); });
    }

    window.addEventListener("load", start);
  </script>
</body>
</html>
